<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TV Center</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #141414; color: #e5e5e5;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .wrap { height: 100%; display: flex; flex-direction: column; padding: 48px 56px; box-sizing: border-box; }
      h1 { color: #e50914; letter-spacing: 2px; margin: 0 0 4px; font-size: 28px; }
      .sub { opacity: .6; margin-bottom: 24px; }
      #log {
        flex: 1; overflow-y: auto; white-space: pre-wrap;
        font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px;
        background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px;
        padding: 16px; line-height: 1.5;
      }
      .spinner {
        width: 14px; height: 14px; border: 2px solid #555; border-top-color: #e50914;
        border-radius: 50%; display: inline-block; animation: spin 1s linear infinite; margin-right: 8px;
        vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>TV CENTER</h1>
      <div class="sub"><span class="spinner"></span>Getting your library ready…</div>
      <div id="log">Starting up…</div>
    </div>
    <script>
      const log = document.getElementById("log");
      window.tvcenter?.onStatus((line) => {
        log.textContent += "\n" + line;
        log.scrollTop = log.scrollHeight;
      });
    </script>
  </body>
</html>
